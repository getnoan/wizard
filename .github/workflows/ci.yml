name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy: { matrix: { node: ["18", "20", "22"] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ matrix.node }}" }
      - run: node --test
      - name: The help text prints, and a non-interactive run without a key exits 2 as documented
        env:
          NOAN_WIZARD_NO_TELEMETRY: "1"   # belt and braces: telemetryEnabled already refuses when CI is set
        run: |
          node bin/wizard.mjs --help | head -3
          set +e; node bin/wizard.mjs --yes --dir . >/dev/null 2>&1; code=$?; set -e
          echo "exit=$code"; test "$code" -eq 2
