# Publishes @getnoan/wizard to npm from a GitHub release, with no token anywhere:
# npm's trusted publishing trusts THIS workflow file in THIS repo, by name, and the
# provenance attestation is generated automatically. Configure it once on the
# package's npm settings page (Trusted Publisher → GitHub Actions: organisation
# getnoan, repository wizard, workflow filename publish.yml). Until that is done,
# this workflow fails at `npm publish` and nothing is published.
#
# A GitHub release tagged v0.1.0 publishes version 0.1.0 under the tag `next`
# when the release is marked as a pre-release, and under `latest` otherwise —
# so launch day is "edit the release, untick pre-release" or a new release.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (next while private, latest at launch)"
        required: true
        default: "next"

permissions:
  contents: read
  id-token: write   # the OIDC token npm trusts instead of a secret

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A release no longer publishes on its own: the job waits in the npm-publish environment
    # until Dan or Marie approves it (Settings → Environments). The environment only accepts
    # v* tags and main, and only repo admins can create or move a v* tag (the "Release tags:
    # admins only" ruleset). On npmjs.com the trusted publisher names this environment as well,
    # so a run outside it cannot publish even if someone edits this file.
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"          # trusted publishing needs Node ≥ 22.14 and npm ≥ 11.5.1
          registry-url: "https://registry.npmjs.org"
          # Never restore a dependency cache in the job that publishes: a poisoned cache could run
          # attacker code with the OIDC token in reach. setup-node turns caching on by itself when
          # package.json names a packageManager, so this says no now, before anyone adds one.
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: node --test
      - name: The tag in package.json matches the release tag
        if: github.event_name == 'release'
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "::error::package.json is $v but the release is ${{ github.event.release.tag_name }}"; exit 1; }
      - name: Publish
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="$([ "${{ github.event.release.prerelease }}" = "true" ] && echo next || echo latest)"
          else
            tag="${{ inputs.tag }}"
          fi
          echo "publishing $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version") as --tag $tag"
          npm publish --access public --tag "$tag"
